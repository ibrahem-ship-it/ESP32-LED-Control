<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحكم ESP32 IoT</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .btn { padding: 15px 30px; font-size: 20px; cursor: pointer; margin: 10px; border-radius: 5px; color: white; border: none; }
        .btn-on { background-color: #4CAF50; }
        .btn-off { background-color: #f44336; }
    </style>
</head>
<body>
    <h1>التحكم في الإضاءة عبر الإنترنت</h1>
    <button class="btn btn-on" onclick="controlLED(1)">تشغيل الليد (ON)</button>
    <button class="btn btn-off" onclick="controlLED(0)">إيقاف الليد (OFF)</button>

    <script>
        // بيانات مشروعك الحقيقية التي قمت بجلبها
        const firebaseConfig = {
            apiKey: "AIzaSyATgHCSNTwGVQgUrSuOWCTuYcvw6G2ZeaE",
            authDomain: "esp32-led-control-28bef.firebaseapp.com",
            databaseURL: "https://esp32-led-control-28bef-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "esp32-led-control-28bef",
            storageBucket: "esp32-led-control-28bef.firebasestorage.app",
            messagingSenderId: "726484303182",
            appId: "1:726484303182:web:f355ae87f9f2b0764f321f"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // دالة إرسال الأمر لقاعدة البيانات
        function controlLED(status) {
            database.ref('IoT_Device/LED_Status').set(status)
                .then(() => console.log('تم التحديث بنجاح'))
                .catch((error) => console.error("Error:", error));
        }
    </script>
</body>
</html>
